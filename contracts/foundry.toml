[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
bohr_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

[etherscan]
bohr_testnet = { key = "placeholder", url = "https://scan.bohr.life/api" }
bot_mainnet = { key = "placeholder", url = "https://scan.botchain.ai/api" }
